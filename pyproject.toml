[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragdoc"
version = "0.1.0"
description = "Headless diagnostic for PDF RAG pipelines: attributes a lost answer to the pipeline stage that lost it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmed Imran" }]
# Pinned to 3.12: the embedding stack (sentence-transformers / torch) does not
# reliably install on 3.14.
requires-python = ">=3.12,<3.13"
# PyMuPDF / pdfplumber / pypdf extract the PDF. sentence-transformers runs the
# embedding model locally, downloading it only on first use (offline thereafter);
# numpy backs the retriever's brute-force cosine scoring. The embedding stack is
# imported lazily, so the heavy import stays confined to the indexer.
dependencies = ["PyMuPDF>=1.24", "pdfplumber>=0.10", "pypdf>=6.21.2", "sentence-transformers>=2.2", "numpy>=1.24"]
keywords = ["rag", "pdf", "retrieval-augmented-generation", "embeddings", "llm", "diagnostics", "attribution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ragdoc = "ragdoc.cli:main"
